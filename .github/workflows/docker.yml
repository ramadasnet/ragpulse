name: Docker images
on:
    push:
        branches:
            - master
    workflow_dispatch:
concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true
jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun run check
    build:
        needs: check
        name: build (${{ matrix.app }}, ${{ matrix.arch }})
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: true
            matrix:
                app: [admin, chat]
                arch: [amd64, arm64]
                include:
                    - arch: amd64
                      runner: ubuntu-latest
                    - arch: arm64
                      runner: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v7
            - id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ragpulse-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: ${{ matrix.app }}
                  platforms: linux/${{ matrix.arch }}
                  outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
                  cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }},mode=max
            - name: Export digest
              run: |
                  mkdir -p "${RUNNER_TEMP}/digests"
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
            - uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ matrix.app }}-${{ matrix.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1
    merge:
        needs: build
        name: publish (${{ matrix.app }})
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: read
            packages: write
        env:
            DOKPLOY_ENABLED: ${{ secrets.DOKPLOY_API_KEY != '' && secrets.DOKPLOY_URL != '' }}
        strategy:
            matrix:
                app: [admin, chat]
        steps:
            - id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ragpulse-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
            - uses: actions/download-artifact@v8
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-${{ matrix.app }}-*
                  merge-multiple: true
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Create multi-arch manifest
              working-directory: ${{ runner.temp }}/digests
              run: |
                  image="${{ steps.image.outputs.name }}"
                  docker buildx imagetools create \
                    -t "${image}:${{ github.sha }}" \
                    -t "${image}:latest" \
                    $(printf "${image}@sha256:%s " *)
            - name: Inspect image
              run: docker buildx imagetools inspect "${{ steps.image.outputs.name }}:${{ github.sha }}"
            - name: Redeploy in Dokploy
              if: env.DOKPLOY_ENABLED == 'true'
              env:
                  DOKPLOY_APP_ID: ${{ matrix.app == 'admin' && secrets.DOKPLOY_ADMIN_APP_ID || matrix.app == 'chat' && secrets.DOKPLOY_CHAT_APP_ID || '' }}
              run: |
                  if [ -z "${DOKPLOY_APP_ID}" ]; then
                    echo "::error::No Dokploy application ID set for ${{ matrix.app }} (DOKPLOY_ADMIN_APP_ID / DOKPLOY_CHAT_APP_ID)"
                    exit 1
                  fi
                  curl -fsSL -X POST "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
                    -H "x-api-key: ${{ secrets.DOKPLOY_API_KEY }}" \
                    -H "Content-Type: application/json" \
                    -d "{\"applicationId\": \"${DOKPLOY_APP_ID}\"}"
